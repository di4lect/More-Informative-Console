name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
      VCPKG_FEATURE_FLAGS: manifests,binarycaching
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          # The project's CMakeLists looks for CommonLibSSE; the repo ships the multi-runtime (SE/AE/VR) CommonLibVR fork under that role.
          "CommonLibSSEPath=${{ github.workspace }}\extern\CommonLibVR" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', '.gitmodules') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTS=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Collect output
        shell: pwsh
        run: |
          $out = "dist/SKSE/Plugins"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Get-ChildItem -Recurse build -Include MoreInformativeConsole.dll,MoreInformativeConsole.pdb | Where-Object { $_.FullName -match 'Release' } | Copy-Item -Destination $out
          Copy-Item release/*.ini $out
          Get-ChildItem -Recurse dist

      - uses: actions/upload-artifact@v4
        with:
          name: MoreInformativeConsole-${{ github.sha }}
          path: dist
