; Vampire Eye Glow Fix
; Changes the eye glow on actors as they load. Nothing on disk is edited.

[General]
; 1 = on, 0 = off
bEnabled=1

; Which eyes to change:
; 0 = vampires only  (actor's race or NPC has the Vampire keyword, OR the eye shape itself is a vampire eye
;                     - that also catches cured NPCs like Serana whose FaceGen still has vampire eyes)
; 1 = every glowing eye (also removes intentional glows such as glowing Khajiit or custom-race eyes)
iMode=0

; 1 = write every changed eye to Documents\My Games\Skyrim Special Edition\SKSE\VampireEyeGlowFix.log
bDebugLog=0

[Glow]
; Glow strength to apply. 0.0 = no glow at all. Try 0.1 - 0.3 for a faint glow.
fEmissiveMult=0.0

; Optional glow colour (R,G,B from 0-255) used when fEmissiveMult is above 0.
; Leave empty to keep each mesh's own glow colour, just weaker. Example for a faint red: 120,10,10
sEmissiveColor=

; Eyes whose glow (brightest colour channel x multiplier) is at or below this are treated as not glowing and left alone.
fGlowThreshold=0.01
